<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script src="/theme.js"></script>
  <title>VisWCAG — WCAG 2.2 accessibility checker</title>
  <meta name="description" content="Open-source accessibility checker. Tests web pages against WCAG 2.2 in a local browser and marks every finding on a snapshot of the page.">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='16' r='5' fill='%23AB1418'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23F08C1A'/%3E%3Ccircle cx='23' cy='16' r='5' fill='%2317642F'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- ───────────── Home ───────────── -->
  <div id="home" class="home">
    <div class="home-top">
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" title="Dark mode">
        <span class="visually-hidden">Dark mode</span>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <main id="main" class="home-main" tabindex="-1">
      <h1 class="wordmark">
        <span class="wordmark-text">VisWCAG</span>
        <svg class="tideline" viewBox="0 0 420 44" aria-hidden="true" focusable="false">
          <path d="M4 26 C 44 6, 84 6, 124 26 S 204 46, 244 26 S 324 6, 364 26 S 404 40, 416 34" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <g class="tide-marks">
            <g transform="translate(124 26)"><g class="mk"><circle r="12" class="m-error"/><text y="5">1</text></g></g>
            <g transform="translate(244 26)"><g class="mk"><circle r="12" class="m-alert"/><text y="5" class="dark">2</text></g></g>
            <g transform="translate(364 26)"><g class="mk"><circle r="12" class="m-pass"/><text y="5">3</text></g></g>
          </g>
        </svg>
      </h1>

      <form class="search" id="home-form" role="search" novalidate>
        <label for="home-url" class="visually-hidden">Web address to check</label>
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="home-url" name="url" type="text" inputmode="url" autocomplete="url" spellcheck="false"
                 placeholder="https://example.com" aria-describedby="home-help home-error">
        </div>
        <p id="home-error" class="field-error" role="alert"></p>
        <div class="search-actions">
          <button type="submit" class="btn btn-primary" value="page">Check page</button>
          <button type="submit" class="btn btn-secondary" value="site">Full website report</button>
        </div>
        <p id="home-help" class="home-help">
          <span>Check one page, or build a report for a whole website.</span>
          <span class="home-help-sub">Tests WCAG 2.2 Level A and AA, in a browser on your computer.</span>
        </p>
      </form>
    </main>
    <footer class="home-footer">
      <p><a class="repo-link" href="https://github.com/5hachaf/viswcag">
        <span class="repo-icon" aria-hidden="true"></span>
        View on GitHub</a></p>
      <p><a href="/rules">What VisWCAG checks</a></p>
    </footer>
  </div>

  <!-- ───────────── App (results and website report) ───────────── -->
  <div id="app" class="report" hidden>
    <header class="topbar">
      <a href="/" class="topbar-brand" id="brand-link">
        <span class="brand-dots" aria-hidden="true"><i class="d-error"></i><i class="d-alert"></i><i class="d-pass"></i></span>
        <span>VisWCAG</span>
      </a>
      <form class="topbar-search" id="top-form" role="search" novalidate>
        <label for="top-url" class="visually-hidden">Web address to check</label>
        <input id="top-url" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://example.com">
        <button type="submit" class="btn btn-primary btn-sm" value="page">Check page</button>
        <button type="submit" class="btn btn-secondary btn-sm" value="site">Full website report</button>
      </form>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" title="Dark mode">
        <span class="visually-hidden">Dark mode</span>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div id="report" class="layout" hidden>
      <aside class="panel" aria-label="Results">
        <div id="panel-head" class="panel-head"></div>
        <div id="panel-body" class="panel-body"></div>
      </aside>

      <main id="main-report" class="stage" tabindex="-1">
        <h2 class="visually-hidden">Annotated page snapshot</h2>
        <div id="stage-body" class="stage-body"></div>
      </main>
    </div>

    <main id="site" class="site-view" tabindex="-1" hidden></main>
  </div>

  <div id="live" class="visually-hidden" aria-live="polite"></div>
  <script src="/report.js"></script>
  <script src="/site.js"></script>
  <script src="/app.js"></script>
</body>
</html>
